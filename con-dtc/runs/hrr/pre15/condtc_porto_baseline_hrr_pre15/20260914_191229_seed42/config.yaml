experiment:
  name: condtc_porto_baseline_hrr_pre15
  output_root: runs/hrr/pre15
data:
  dataset: portoTimeNoiseFineGrained
  batch_size: 32
  initialization_batch_size: 256
model:
  num_clusters: 27
loss:
  time_loss_weight: 0.1
  clustering_loss_weight: 0.5
  instance_temperature: 0.5
  cluster_temperature: 1.0
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0
  history_instance_loss_weight: 0.0
  history_instance_temperature: 0.5
  history_instance_start_epoch: 3
  history_encoder_ema_momentum: null
optimizer:
  representation_learning_rate: 5.0e-05
  clustering_learning_rate: 0.00015
  weight_decay: 0.01
training:
  num_epochs: 6
  seed: 42
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null
  save_representation_history: true
  checkpoint_selection: last
checkpoint:
  pretrain_path: checkpoints/sttraj2vec_porto_finegrained_pre15.pt
target_history: null
lfss:
  enabled: true
  noise_weight: 1.0
  instance_weight: 0.1
  target_momentum: 0.996
  temperature: 0.5
  noise_std: 0.001
  projection_dim: 256
  hidden_dim: 4096

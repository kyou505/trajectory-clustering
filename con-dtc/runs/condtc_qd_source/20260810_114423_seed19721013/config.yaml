  clustering_learning_rate: 0.0001
  weight_decay: 0.01
training:
  num_epochs: 1
  seed: 19721013
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null
checkpoint:
  pretrain_path: checkpoints/sttraj2vec_pretrain_source.pt

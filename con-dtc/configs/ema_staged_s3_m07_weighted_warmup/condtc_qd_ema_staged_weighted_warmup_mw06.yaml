# Con-DTC 青岛数据集分阶段 EMA + 联合加权线性 warm-up 实验配置
#
# 除 target_history.minimum_weight 和 weight_warmup 外，本配置与
# condtc_qd_ema_staged_weighted_mw06.yaml 保持一致，用于比较直接加权和
# 线性启用加权的差异。

experiment:
  # 实现设置：实验名称，用于区分 minimum_weight=0.6 的 warm-up 实验。
  name: condtc_qd_ema_staged_s3_m07_weighted_warmup_mw06

  # 实现设置：保存配置快照、日志和 checkpoint 的根目录。
  output_root: runs

data:
  # 源码设置：作者发布的青岛数据集目录。
  dataset: qdTimeNoise0424

  # 论文第 6.3 节：训练 batch size 为 32。
  batch_size: 32

  # 实现设置：KMeans 初始化和全局目标计算的推理批大小。
  initialization_batch_size: 256

model:
  # 论文第 6.1 节：青岛数据集包含 12 个真实簇。
  num_clusters: 12

loss:
  # 论文公式（14）、（19）：时间预测损失权重 alpha=0.1。
  time_loss_weight: 0.1

  # 论文公式（18）、（19）：聚类损失权重 beta=0.5。
  clustering_loss_weight: 0.5

  # 源码中的实例级 InfoNCE 温度；对应损失权重为 0，不参与本实验。
  instance_temperature: 0.5

  # 源码中的簇级 InfoNCE 温度；对应损失权重为 0，不参与本实验。
  cluster_temperature: 1.0

  # 论文目标不包含源码额外的实例级 InfoNCE，因此关闭。
  instance_loss_weight: 0.0

  # 论文目标不包含源码额外的簇级 InfoNCE，因此关闭。
  cluster_contrastive_loss_weight: 0.0

optimizer:
  # 论文第 6.3 节：表示层微调学习率为 5e-5。
  representation_learning_rate: 0.00005

  # 论文第 6.3 节：聚类层学习率为 15e-5。
  clustering_learning_rate: 0.00015

  # 论文使用 AdamW 但未报告 weight decay，采用 PyTorch 默认值 0.01。
  weight_decay: 0.01

training:
  # 按论文图 7 中聚类趋于稳定的位置运行 6 个 epoch。
  num_epochs: 6

  # 论文未报告随机种子，采用作者公开青岛脚本设置。
  seed: 19721013

  # 实现设置：每隔 50 个 step 输出训练日志。
  log_interval: 50

  # null 表示正式实验使用全部初始化和训练批次。
  max_initialization_batches: null
  max_train_batches: null

target_history:
  # 分阶段 EMA 的固定动量。
  momentum: 0.7

  # 前两个 epoch 使用当前目标，从第 3 个 epoch 开始使用 EMA。
  start_epoch: 3

  # 使用“分配稳定性 × 决策置信度”作为联合可靠性。
  weighting_signal: stability_margin

  # 开启 DEC 样本权重下限的线性 warm-up。
  weight_warmup: true

  # warm-up 最后一个 epoch 到达的目标权重下限。
  minimum_weight: 0.6

checkpoint:
  # 使用与其他 pre15 实验相同的预训练 checkpoint，保证唯一变量是加权方式。
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper_15ep.pt

# 官方源码默认配方（run2.py 默认参数，exp2.py 训练循环）
# 与源码的已知差异：动量编码器（momentum=0.995）与不对称增强未实现
experiment:
  name: condtc_qd_source
  output_root: runs

data:
  dataset: qdTimeNoise0424
  batch_size: 32            # --bs 32
  initialization_batch_size: 256

model:
  num_clusters: 12

loss:
  time_loss_weight: 1.0     # --tRate 1.0（源码默认，非论文 α=0.1）
  clustering_loss_weight: 2.0   # --gamma 2，KL 双视图求和不除 2
  instance_temperature: 0.5     # infonce(head_in1, head_in, 0.5)
  cluster_temperature: 1.0      # infonce(head_cl1, head_cl, 1)
  instance_loss_weight: 1.0     # --ncein 1
  cluster_contrastive_loss_weight: 1.0  # --ncecl 1

optimizer:
  representation_learning_rate: 0.0001  # --lr 1e-4
  clustering_learning_rate: 0.0001
  weight_decay: 0.01

training:
  num_epochs: 1             # --epoch 1
  seed: 19721013            # 源码固定种子
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

checkpoint:
  pretrain_path: checkpoints/sttraj2vec_pretrain_source.pt  # tRate=1.0 预训练版本

# 分阶段 EMA 未加权对照实验。
# 与其他权重强度实验保持完全相同的训练配方，仅关闭样本加权。
experiment:
  # 实验名称，用于隔离保存未加权对照结果。
  name: condtc_qd_s3_m07_unweighted
  output_root: runs

data:
  dataset: qdTimeNoise0424
  batch_size: 32
  initialization_batch_size: 256

model:
  num_clusters: 12

loss:
  time_loss_weight: 0.1
  clustering_loss_weight: 0.5
  instance_temperature: 0.5
  cluster_temperature: 1.0
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  representation_learning_rate: 0.00005
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

target_history:
  enabled: true
  # epoch 1～2 使用当前目标，epoch 2 初始化 EMA，epoch 3 开始使用 EMA 目标。
  start_epoch: 3
  momentum: 0.7
  # 权重恒为 1，作为分阶段 EMA 的未加权对照。
  minimum_weight: 1.0
  # 对照组不需要 warm-up。
  weight_warmup: false
  save_interval: 1
  save_raw_assignments: true

training:
  num_epochs: 6
  # 多种子实验时仅修改这一项，其他配置必须保持不变。
  seed: 19721013
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

checkpoint:
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper_15ep.pt

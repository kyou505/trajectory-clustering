# 论文正文配方（4.3 节 + 6.3 节实验设置）
# 论文的 Lc 只有 KL 对比聚类损失，无 InfoNCE 投影头，故两个 nce 权重为 0
experiment:
  name: condtc_qd_paper
  output_root: runs

data:
  dataset: qdTimeNoise0424
  batch_size: 32
  initialization_batch_size: 256

model:
  num_clusters: 12

loss:
  time_loss_weight: 0.1     # α=0.1（论文 Fig 5(c) 调参结论）
  clustering_loss_weight: 0.5  # 论文 β=0.5
  instance_temperature: 0.5     # 未使用（权重为 0）
  cluster_temperature: 1.0      # 未使用（权重为 0）
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  representation_learning_rate: 0.00005  # 论文微调 lr 5e-5
  clustering_learning_rate: 0.00015      # 论文聚类层 lr 15e-5
  weight_decay: 0.01

training:
  num_epochs: 6             # 论文 Fig 7：6 个 epoch 内稳定
  seed: 19721013            # 与源码配置保持一致便于对比
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

checkpoint:
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper.pt  # α=0.1 预训练版本

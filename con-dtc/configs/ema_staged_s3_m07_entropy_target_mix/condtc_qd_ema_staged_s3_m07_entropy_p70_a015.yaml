# Con-DTC 青岛数据集：分阶段 EMA + P70/A0.15 熵目标插值
# 与 P70/A0.25 配置相比，唯一算法差异是高熵样本的 EMA target
# 比例由 0.25 降至 0.15。

experiment:
  name: condtc_qd_ema_staged_s3_m07_entropy_p70_a015
  output_root: runs

data:
  dataset: qdTimeNoise0424
  # 论文第 6.3 节：batch size = 32。
  batch_size: 32
  # 仅控制 KMeans 初始化和全局目标计算时的显存占用。
  initialization_batch_size: 256

model:
  # 青岛数据集包含 12 个真实簇。
  num_clusters: 12

loss:
  # 论文公式（14）、（19）及图 5(c)：alpha = 0.1。
  time_loss_weight: 0.1
  # 论文公式（18）、（19）及图 5(c)：beta = 0.5。
  clustering_loss_weight: 0.5
  # 对应损失权重为 0，以下温度不参与本实验优化。
  instance_temperature: 0.5
  cluster_temperature: 1.0
  # 论文聚类目标不包含当前实现额外提供的两个 InfoNCE 项。
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  # 论文第 6.3 节：表示层微调学习率为 5e-5。
  representation_learning_rate: 0.00005
  # 论文第 6.3 节：聚类层学习率为 15e-5。
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

training:
  # 论文图 7 显示聚类层在约 6 个 epoch 内稳定。
  num_epochs: 6
  # 与现有 P70/A0.25 配置保持一致。
  seed: 19721013
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

target_history:
  # epoch 1～2 使用当前目标，epoch 3 起启用 EMA。
  start_epoch: 3
  momentum: 0.7
  # 根据当前软分配熵插值 EMA target 与当前 DEC target。
  entropy_target_mix_enabled: true
  # 熵最高的约 30% 样本进入高熵分支。
  entropy_quantile: 0.7
  # 高熵样本使用 15% EMA target 与 85% 当前 target。
  high_entropy_ema_alpha: 0.15

checkpoint:
  # 与 P70/A0.25 使用相同的 pre15 预训练 checkpoint。
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper_15ep.pt

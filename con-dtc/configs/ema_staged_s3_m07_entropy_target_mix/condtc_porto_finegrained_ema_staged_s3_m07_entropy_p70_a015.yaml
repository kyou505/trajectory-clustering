# Con-DTC Porto 细粒度加难数据集：分阶段 EMA + P70/A0.25 熵目标插值
#
# 与 configs/baseline/condtc_porto_finegrained_baseline_pre15.yaml 对比时，
# 数据、预训练 checkpoint、模型、优化器、训练轮数和随机种子完全相同；
# 唯一算法差异是下方 target_history。

experiment:
  name: porto/entropy_target_mix/condtc_porto_finegrained_s3_m07_p70_a015
  output_root: runs

data:
  # 按论文 Algorithm 1 公开信息构造的 Porto 重建数据集。
  dataset: portoTimeNoiseFineGrained
  # 论文第 6.3 节设置。
  batch_size: 32
  # 仅控制 KMeans 初始化和全局目标计算时的显存占用。
  initialization_batch_size: 256

model:
  # 9 条基础路径，每条包含原始、时移、变速三个类别。
  num_clusters: 27

loss:
  # 论文公式（14）、（19）及图 5(c) 的 alpha。
  time_loss_weight: 0.1
  # 论文公式（18）、（19）及图 5(c) 的 beta。
  clustering_loss_weight: 0.5
  # 对应损失权重为 0，因此以下温度不参与本实验优化。
  instance_temperature: 0.5
  cluster_temperature: 1.0
  # 保持与 Porto baseline 一致，关闭额外的两个 InfoNCE 项。
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  # 论文第 6.3 节：表示层微调学习率 5e-5。
  representation_learning_rate: 0.00005
  # 论文第 6.3 节：聚类层学习率 15e-5。
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

training:
  # 与 baseline 保持一致。
  num_epochs: 6
  seed: 42
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

target_history:
  # epoch 1～2 使用当前跨视图 DEC target，epoch 3 起启用 EMA。
  start_epoch: 3
  # 历史软分配 EMA 的动量。
  momentum: 0.7
  # 使用软分配熵决定 EMA target 与当前 target 的逐样本混合比例。
  entropy_target_mix_enabled: true
  # P70：熵最高的约 30% 样本进入高熵分支。
  entropy_quantile: 0.7
  # 高熵样本使用 15% EMA target 与 85% 当前 target；
  # 其余约 70% 样本完全使用 EMA target。
  high_entropy_ema_alpha: 0.15

checkpoint:
  # 必须和 baseline 使用同一个 Porto 预训练 checkpoint。
  pretrain_path: checkpoints/sttraj2vec_porto_finegrained_pre15.pt

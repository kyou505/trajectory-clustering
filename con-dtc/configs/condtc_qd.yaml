experiment:
  name: condtc_qd
  output_root: runs

data:
  dataset: qdTimeNoise0424
  batch_size: 32
  initialization_batch_size: 256

model:
  num_clusters: 12

loss:
  time_loss_weight: 0.0
  clustering_loss_weight: 2.0
  instance_temperature: 0.5
  cluster_temperature: 1.0
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  representation_learning_rate: 0.00005
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

training:
  num_epochs: 1
  seed: 19721013
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

checkpoint:
  pretrain_path: checkpoints/sttraj2vec_pretrain_best.pt
  filename: condtc_best.pt
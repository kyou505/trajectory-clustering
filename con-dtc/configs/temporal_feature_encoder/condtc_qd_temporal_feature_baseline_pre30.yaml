# Con-DTC 青岛数据集：pre30 轨迹级时间特征编码对照实验
#
# 实验目的：
#   在 QD pre30 baseline 上仅增加轨迹级时间特征编码器，判断预训练表示
#   已较充分时，显式起始时间、持续时长和点间时间间隔是否仍有独立收益。
#
# 对照配置：configs/baseline/condtc_qd_baseline_pre30.yaml
# 唯一算法差异：model.temporal_feature_enabled = true。
# 本实验保持聚类层学习率为 baseline 的 15e-5，不混入高学习率、EMA、
# 熵目标插值或 DEC 样本加权，避免无法判断性能变化的来源。

experiment:
  # 用于区分 pre30 baseline 与时间特征编码实验。
  name: condtc_qd_temporal_feature_baseline_pre30

  # 实验日志、checkpoint 和评估结果的保存根目录。
  output_root: runs

data:
  # 与 QD pre30 baseline 使用相同的数据集。
  dataset: qdTimeNoise0424

  # 论文第 6.3 节：batch size = 32。
  batch_size: 32

  # 仅影响 KMeans 初始化和全量目标计算的推理批大小。
  initialization_batch_size: 256

model:
  # 青岛数据集包含 12 个真实簇。
  num_clusters: 12

  # 本实验唯一新增模块：启用轨迹级时间特征编码器。
  temporal_feature_enabled: true

  # 时间特征 MLP 的隐藏维度，与 pre15 时间特征实验保持一致。
  temporal_hidden_dim: 64

loss:
  # 论文公式（14）、（19）及图 5(c)：时间预测损失权重 alpha = 0.1。
  time_loss_weight: 0.1

  # 论文公式（18）、（19）及图 5(c)：聚类损失权重 beta = 0.5。
  clustering_loss_weight: 0.5

  # 论文目标不包含当前实现额外提供的两个 InfoNCE 损失，因此权重为 0。
  instance_temperature: 0.5
  cluster_temperature: 1.0
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  # 与 pre30 baseline 一致：表示层及新增时间编码器使用 5e-5。
  representation_learning_rate: 0.00005

  # 与 pre30 baseline 一致：聚类中心学习率为 15e-5。
  # 不使用 temporal pre15 后续诊断中的 5e-4，保证唯一变量是时间编码器。
  clustering_learning_rate: 0.00015

  # 与 baseline 一致：AdamW weight decay。
  weight_decay: 0.01

training:
  # 与 QD pre30 baseline 一致，训练 6 个 epoch。
  num_epochs: 6

  # 与 baseline 使用相同随机种子，便于进行配对比较。
  seed: 19721013

  # 仅控制终端日志打印频率，不影响优化。
  log_interval: 50

  # null 表示正式实验使用全部数据。
  max_initialization_batches: null
  max_train_batches: null

checkpoint:
  # 与 QD pre30 baseline 使用同一个预训练 checkpoint。
  # 时间特征 MLP 不在该 checkpoint 中，将在 DEC 阶段随机初始化并训练。
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper_30ep.pt

# Con-DTC Porto 细粒度数据集：分阶段 EMA + 稳定性反向加权
#
# 与同参数的未加权 S3/M0.7 实验对比时，唯一算法差异是：
# EMA 启用后提高跨 epoch 不稳定样本的 DEC 相对权重。

experiment:
  name: condtc_porto_finegrained_s3_m07_reverse_stability_w125
  output_root: runs

data:
  # 按论文 Algorithm 1 公开信息构造的 Porto 细粒度数据集。
  dataset: portoTimeNoiseFineGrained
  # 论文第 6.3 节：batch size = 32。
  batch_size: 32
  # 仅影响 KMeans 初始化和全局目标计算的显存占用。
  initialization_batch_size: 256

model:
  # 9 条基础路径，每条包含原始、时移和变速三个类别。
  num_clusters: 27

loss:
  # 论文公式（14）、（19）及图 5(c)：alpha = 0.1。
  time_loss_weight: 0.1
  # 论文公式（18）、（19）及图 5(c)：beta = 0.5。
  clustering_loss_weight: 0.5
  # 对应的两个 InfoNCE 权重为 0，温度不参与本实验优化。
  instance_temperature: 0.5
  cluster_temperature: 1.0
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  # 论文第 6.3 节：表示层微调学习率为 5e-5。
  representation_learning_rate: 0.00005
  # 论文第 6.3 节：聚类层学习率为 15e-5。
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

training:
  # 与 Porto baseline 和 S3/M0.7 对照保持一致。
  num_epochs: 6
  seed: 42
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

target_history:
  # epoch 1～2 使用当前目标，epoch 3 起启用 EMA。
  start_epoch: 3
  momentum: 0.7
  # 只根据跨 epoch 相对稳定性分配反向权重，不使用 margin。
  weighting_signal: stability
  # w_i = 1.25 + (1 - 1.25) * S_i，权重范围为 [1.0, 1.25]。
  minimum_weight: 1.25

checkpoint:
  # 与 Porto FineGrained 对照实验使用同一个 pre15 checkpoint。
  pretrain_path: checkpoints/sttraj2vec_porto_finegrained_pre15.pt

# Con-DTC 青岛数据集：分阶段 EMA + 稳定性反向加权实验
#
# 对照配置：configs/ema_staged/condtc_qd_ema_staged_s3_m07.yaml
# 本实验保持数据、预训练权重、模型、优化器和训练轮数一致，
# 仅在 EMA 启用后提高跨 epoch 不稳定样本的 DEC 相对权重。

experiment:
  # W125 表示最不稳定样本的原始权重上限为 1.25。
  name: condtc_qd_ema_staged_s3_m07_reverse_stability_w125
  output_root: runs

data:
  # 作者公开的青岛轨迹数据集。
  dataset: qdTimeNoise0424
  # 论文第 6.3 节：batch size = 32。
  batch_size: 32
  # 仅影响 KMeans 初始化和全局目标计算的显存占用。
  initialization_batch_size: 256

model:
  # 青岛数据集包含 12 个真实簇。
  num_clusters: 12

loss:
  # 论文公式（14）、（19）及图 5(c)：alpha = 0.1。
  time_loss_weight: 0.1
  # 论文公式（18）、（19）及图 5(c)：beta = 0.5。
  clustering_loss_weight: 0.5
  # 对应的两个 InfoNCE 权重为 0，温度不参与本实验优化。
  instance_temperature: 0.5
  cluster_temperature: 1.0
  # 保持与 S3/M0.7 对照一致，关闭额外 InfoNCE 损失。
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  # 论文第 6.3 节：表示层微调学习率为 5e-5。
  representation_learning_rate: 0.00005
  # 论文第 6.3 节：聚类层学习率为 15e-5。
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

training:
  # 与 S3/M0.7 对照保持一致。
  num_epochs: 6
  seed: 19721013
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

target_history:
  # epoch 1～2 使用当前跨视图 DEC target，epoch 3 起启用 EMA。
  start_epoch: 3
  # 历史软分配的 EMA 动量。
  momentum: 0.7
  # 只根据跨 epoch 相对稳定性分配权重，不使用 margin。
  weighting_signal: stability
  # 沿用现有字段名：值大于 1 时执行反向加权。
  # 权重公式为 w_i = 1.25 + (1 - 1.25) * S_i：
  # 稳定样本 S_i=1 时权重为 1，最不稳定样本 S_i=0 时权重为 1.25。
  minimum_weight: 1.25

checkpoint:
  # 与 S3/M0.7 对照使用同一个 pre15 预训练 checkpoint。
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper_15ep.pt

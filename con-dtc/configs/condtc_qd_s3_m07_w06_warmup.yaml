# 分阶段 EMA + 中等强度线性 warm-up 加权实验。
# 有效权重下限在 epoch 3～6 从 1.0 线性下降到 0.6。
experiment:
  name: condtc_qd_s3_m07_w06_warmup
  output_root: runs

data:
  dataset: qdTimeNoise0424
  batch_size: 32
  initialization_batch_size: 256

model:
  num_clusters: 12

loss:
  time_loss_weight: 0.1
  clustering_loss_weight: 0.5
  instance_temperature: 0.5
  cluster_temperature: 1.0
  instance_loss_weight: 0.0
  cluster_contrastive_loss_weight: 0.0

optimizer:
  representation_learning_rate: 0.00005
  clustering_learning_rate: 0.00015
  weight_decay: 0.01

target_history:
  enabled: true
  start_epoch: 3
  momentum: 0.7
  # warm-up 结束后，低可靠性样本至少保留 60% 的 DEC 权重。
  minimum_weight: 0.6
  # epoch 3、4、5、6 的有效下限依次为 1.0、0.867、0.733、0.6。
  weight_warmup: true
  save_interval: 1
  save_raw_assignments: true

training:
  num_epochs: 6
  seed: 19721013
  log_interval: 50
  max_initialization_batches: null
  max_train_batches: null

checkpoint:
  pretrain_path: checkpoints/sttraj2vec_pretrain_paper_15ep.pt
